<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Evan Yeager - Berkeley EECS undergraduate. Personal portfolio showcasing academic work, research papers, projects, and technical writing." />
    <title>Evan Yeager - Portfolio</title>
    <base href="/" />

    <!-- Preload critical resources -->
    <link rel="preload" href="_framework/blazor.webassembly.js" as="script" />
    <link rel="preload" href="css/app.css" as="style" />
    <link rel="preload" href="css/win2000.css" as="style" />

    <!-- Critical CSS -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/win2000.css" />
    <link href="YeagerDotNet.styles.css" rel="stylesheet" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
</head>

<body>
  <div id="app">
    <div class="win98-progress">
      <div class="win98-progress-bar"></div>
    </div>
    <div class="win98-progress-text"></div>
  </div>
  
  <script>
    // Decode the path from the 404 redirect
    (function() {
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect != location.href) {
        history.replaceState(null, null, redirect);
      }
    })();
  </script>

  <script src="_framework/blazor.webassembly.js" autostart="false"></script>
  <script>
    Blazor.start();
  </script>
</body>
</html>
