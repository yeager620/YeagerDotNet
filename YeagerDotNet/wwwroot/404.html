<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // Store the current path in sessionStorage and redirect to index.html
        sessionStorage.redirect = location.href;
        location.replace(location.origin + '/');
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
